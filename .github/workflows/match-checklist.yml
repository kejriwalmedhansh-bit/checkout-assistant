name: Product match checklist

# Reruns the hand-checked link checklist (tests/test_match_checklist.py) and the
# exact-match examples whenever the matching code or its answer key changes, so
# a fix for one product can't quietly break another. Plain Python only: the
# matching code needs nothing beyond the standard library.
on:
  pull_request:
    paths:
      - src/services/product_identity.py
      - src/services/search_service.py
      - tests/test_match_checklist.py
      - tests/test_exact_product_match.py
      - tests/fixtures/match_checklist*.json
      - .github/workflows/match-checklist.yml
  push:
    branches: [main]
    paths:
      - src/services/product_identity.py
      - src/services/search_service.py
      - tests/test_match_checklist.py
      - tests/test_exact_product_match.py
      - tests/fixtures/match_checklist*.json
  workflow_dispatch:

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Scoreboard
        run: python tests/test_match_checklist.py
      - name: Tests
        run: python -m pytest -q tests/test_match_checklist.py tests/test_exact_product_match.py
