name: Keep Supabase awake

# Free Supabase projects are paused after 7 days without activity, which
# silently dropped Dealo's first live purchase record (31 Oct 2026). This
# job reads one row every day so the project never goes idle. Runs here,
# not on Render, because the free Render server sleeps when idle.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SECRET_KEY   (same values as the Render backend)
on:
  schedule:
    - cron: "23 3 * * *"   # 08:53 IST daily
  pull_request:
    paths:
      - .github/workflows/keep-supabase-awake.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from the purchases table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SECRET_KEY secrets are not set"; exit 1
          fi
          code=$(curl -sS -m 30 -o /tmp/out -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/purchases?select=created_at&limit=1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY")
          echo "Supabase answered $code"
          [ "$code" = "200" ] || { cat /tmp/out; exit 1; }
