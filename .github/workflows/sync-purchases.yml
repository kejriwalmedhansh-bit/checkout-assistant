name: Sync affiliate purchases to Mixpanel

# Every 3 hours: reads the last 90 days of sales from Cuelinks and INRDeals and
# sends them to Mixpanel, attributed to the person who clicked (see
# scripts/sync_affiliate_purchases.py). Re-sending is harmless — Mixpanel keeps
# one copy of each event. Runs here, not on Render, because the free Render
# server sleeps when idle.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions):
#   MIXPANEL_SERVICE_ACCOUNT_USERNAME, MIXPANEL_SERVICE_ACCOUNT_SECRET
#   CUELINKS_API_KEY
#   INRDEALS_API_TOKEN, INRDEALS_USERNAME   (optional until INRDeals issues them)
on:
  schedule:
    - cron: "17 */3 * * *"
  # A change to the sync itself re-checks the keys before it can merge.
  pull_request:
    paths:
      - scripts/sync_affiliate_purchases.py
      - .github/workflows/sync-purchases.yml
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to read"
        default: "90"

permissions:
  contents: read

concurrency:
  group: sync-purchases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send purchases to Mixpanel
        env:
          DEALO_ENVIRONMENT: production
          MIXPANEL_SERVICE_ACCOUNT_USERNAME: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_USERNAME }}
          MIXPANEL_SERVICE_ACCOUNT_SECRET: ${{ secrets.MIXPANEL_SERVICE_ACCOUNT_SECRET }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          INRDEALS_API_TOKEN: ${{ secrets.INRDEALS_API_TOKEN }}
          INRDEALS_USERNAME: ${{ secrets.INRDEALS_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/sync_affiliate_purchases.py --check
          else
            python scripts/sync_affiliate_purchases.py --days "${{ github.event.inputs.days || '90' }}"
          fi
