<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealo</title>
<style>
/* Colours from design-system/dealo/MASTER.md. No web fonts: the card's
   sandbox loads nothing from outside, so system faces stand in. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --border:#DBDCD3; --text:#12151A; --text2:#585F5B; --text3:#8B918C;
  --brand:#0A6B41; --brandSoft:#E4EEE6; --brass:#B9852E; --brassSoft:#F4E7CC; --onBrand:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#121311; --surface:#1A1C18; --border:#2C2E27; --text:#EFEEE8; --text2:#A5A99F; --text3:#787D72;
  --brand:#39B57C; --brandSoft:#193226; --brass:#D9A748; --brassSoft:#2E2617; --onBrand:#0B1A12;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121311; --surface:#1A1C18; --border:#2C2E27; --text:#EFEEE8; --text2:#A5A99F; --text3:#787D72;
    --brand:#39B57C; --brandSoft:#193226; --brass:#D9A748; --brassSoft:#2E2617; --onBrand:#0B1A12;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:var(--text);font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
.num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.who b{display:block;font-size:15px}
.who span{font-size:12px;color:var(--text2)}
.pct{background:var(--brandSoft);color:var(--brand);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.money{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:10px 12px}
.money small{display:block;font-size:11px;color:var(--text2)}
.money strong{font-size:18px}
.money .to{color:var(--brass);font-size:18px}
.money .r{text-align:right}
.save{font-size:13px;color:var(--brand);font-weight:600}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{display:flex;gap:8px;align-items:center;font-size:12.5px;line-height:1.3;border:1px solid var(--border);border-radius:10px;padding:8px}
.step i{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:var(--brassSoft);color:var(--brass);font-weight:700;font-size:11px;display:grid;place-items:center}
.note{font-size:12px;color:var(--text2)}
button.buy{all:unset;box-sizing:border-box;cursor:pointer;display:block;text-align:center;background:var(--brand);color:var(--onBrand);font-weight:600;border-radius:10px;padding:11px;font-size:14px}
button.buy:focus-visible,button.opt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.q{font-weight:600}
.opts{display:grid;gap:8px}
button.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
button.opt span{font-size:12px;color:var(--text2);display:block}
.empty{color:var(--text2)}
.foot{font-size:11px;color:var(--text3);text-align:right}
@media (max-width:360px){.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card" id="root"><div class="empty">Checking gift card deals…</div></div>
<script>
(function () {
  var root = document.getElementById("root");
  var nextId = 0, pending = {};

  function rpc(method, params) {
    var id = ++nextId;
    window.parent.postMessage({ jsonrpc: "2.0", id: id, method: method, params: params || {} }, "*");
    return new Promise(function (resolve) { pending[id] = resolve; });
  }
  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method: method, params: params || {} }, "*");
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function rs(n) { return n == null ? "" : "₹" + Math.round(n).toLocaleString("en-IN"); }
  function pct(n) { return (Math.round(n * 100) / 100) + "% off"; }

  function openLink(url) {
    if (!url) return;
    // ChatGPT's own call where it exists, else the standard one (Claude).
    if (window.openai && window.openai.openExternal) window.openai.openExternal({ href: url });
    else rpc("ui/open-link", { url: url });
  }

  function dealHtml(d, amount) {
    var html = '<div class="head"><div class="who"><b>' + esc(d.brand_name) + ' gift card</b>' +
      '<span>from ' + esc(d.source_name) + '</span></div>' +
      '<div class="pct num">' + pct(d.pct) + '</div></div>';
    if (d.priced) {
      html += '<div class="money"><div><small>You pay (UPI)</small><strong class="num">' + rs(d.effective_price) + '</strong></div>' +
        '<div class="to">→</div><div class="r"><small>You get to spend</small><strong class="num">' + rs(amount) + '</strong></div></div>' +
        '<div class="save">You save <span class="num">' + rs(d.saving) + '</span></div>';
    }
    var buy = d.priced ? "Buy " + esc(d.purchase_breakdown) : "Buy the gift card";
    if (d.txns_needed > 1) buy += " (" + d.txns_needed + " orders)";
    html += '<div class="steps"><div class="step"><i>1</i>' + buy + ' on ' + esc(d.source_name) + '</div>' +
      '<div class="step"><i>2</i>Pay with it at ' + esc(d.brand_name) + ' checkout</div></div>';
    var notes = [];
    if (d.remainder > 0) notes.push('<span class="num">' + rs(d.remainder) + '</span> left to pay normally.');
    if (d.card_pct != null && d.card_pct !== d.pct) notes.push("Paying by card gives " + (Math.round(d.card_pct * 100) / 100) + "% instead.");
    if (d.restrictions && d.restrictions.length) notes.push("Not for: " + esc(d.restrictions.join("; ")));
    if (notes.length) html += '<div class="note">' + notes.join(" ") + '</div>';
    html += '<button class="buy" data-url="' + esc(d.buy_url) + '">Buy on ' + esc(d.source_name) + ' ↗</button>';
    return html;
  }

  function render(data) {
    if (!data) return;
    var html;
    if (!data.has_voucher) {
      html = '<div class="empty">No gift card discount for <b>' + esc(data.shop) + '</b> right now.</div>';
    } else if (data.choices && data.choices.length) {
      html = '<div class="q">What are you buying at ' + esc(data.shop) + '?</div><div class="opts">' +
        data.choices.map(function (c, i) {
          return '<button class="opt" data-i="' + i + '"><div><b>' + esc(c.choice_label || c.brand_name) + '</b>' +
            '<span>' + esc(c.source_name) + (c.priced ? ' · save ' + rs(c.saving) : '') + '</span></div>' +
            '<div class="pct num">' + pct(c.pct) + '</div></button>';
        }).join("") + '</div>';
    } else {
      html = dealHtml(data.deal, data.amount);
    }
    root.innerHTML = html + '<div class="foot">Dealo</div>';
    root.querySelectorAll("button.buy").forEach(function (b) {
      b.onclick = function () { openLink(b.getAttribute("data-url")); };
    });
    root.querySelectorAll("button.opt").forEach(function (b) {
      b.onclick = function () {
        var c = data.choices[+b.getAttribute("data-i")];
        root.innerHTML = dealHtml(c, data.amount) + '<div class="foot">Dealo</div>';
        root.querySelector("button.buy").onclick = function () { openLink(c.buy_url); };
      };
    });
  }

  function applyTheme(ctx) {
    if (ctx && (ctx.theme === "dark" || ctx.theme === "light")) document.documentElement.setAttribute("data-theme", ctx.theme);
  }

  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && pending[m.id]) { pending[m.id](m.result); delete pending[m.id]; return; }
    if (m.method === "ui/notifications/tool-result") render(m.params && m.params.structuredContent);
    if (m.method === "ui/notifications/host-context-changed") applyTheme(m.params);
  });

  // ChatGPT hands the result over on window.openai as well.
  function fromOpenAI() {
    if (!window.openai) return;
    applyTheme({ theme: window.openai.theme });
    if (window.openai.toolOutput) render(window.openai.toolOutput);
  }
  window.addEventListener("openai:set_globals", fromOpenAI);
  fromOpenAI();

  rpc("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "dealo-gift-card-deal", version: "1.0.0" },
    appCapabilities: {}
  }).then(function (res) {
    applyTheme(res && res.hostContext);
    notify("ui/notifications/initialized");
  });

  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      notify("ui/notifications/size-changed", { width: document.body.scrollWidth, height: document.body.scrollHeight });
    }).observe(document.body);
  }
})();
</script>
</body>
</html>
