<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="mitgo-verification" content="d6949ac6-f675-4185-9dcb-fba12afd9144" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAFAF7" />
    <title>Dealo — Never pay full price, just search the product</title>
    <meta
      name="description"
      content="Dealo finds the cheapest legitimate way to buy anything online in India — stacking discounted gift vouchers with cashback cards to cut your final checkout price."
    />
    <link rel="canonical" href="https://getdealo.in/" />

    <!--
      Open Graph / Twitter card — the tags a link preview (WhatsApp, Twitter,
      LinkedIn, Slack) actually reads. usePageTitle keeps these in sync with
      the title/description of whichever page is open (see that file); the
      values below are just the fallback for the very first paint and for
      any page that doesn't call the hook.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dealo" />
    <meta property="og:title" content="Dealo — Never pay full price, just search the product" />
    <meta
      property="og:description"
      content="Dealo finds the cheapest legitimate way to buy anything online in India — stacking discounted gift vouchers with cashback cards to cut your final checkout price."
    />
    <meta property="og:url" content="https://getdealo.in/" />
    <meta property="og:locale" content="en_IN" />
    <!-- 1200×630, the size every preview (WhatsApp, LinkedIn, X) crops to without cutting anything off. -->
    <meta property="og:image" content="https://getdealo.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dealo — Never pay full price. Just search. Paste a link, buy a voucher, pay less." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://getdealo.in/og-image.png" />
    <meta name="twitter:title" content="Dealo — Never pay full price, just search the product" />
    <meta
      name="twitter:description"
      content="Dealo finds the cheapest legitimate way to buy anything online in India — stacking discounted gift vouchers with cashback cards to cut your final checkout price."
    />

    <!--
      Organization + WebSite structured data — lets Google show the Dealo
      brand name/logo in search results. Site-wide and static (not
      page-specific), so it lives here rather than in the per-page SEO hook.

      name is "Dealo", the name people search; getdealo (the domain) is the
      alternate. sameAs lists Dealo's own profiles elsewhere — the links Google
      uses to confirm this site *is* the Dealo brand, over lookalike domains.
      Add the LinkedIn page here once it's confirmed.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dealo",
        "alternateName": "getdealo",
        "url": "https://getdealo.in/",
        "logo": "https://getdealo.in/icon-512.png",
        "sameAs": [
          "https://chromewebstore.google.com/detail/fjbkoahbajnddoohobplmafmeiddnkoi",
          "https://www.instagram.com/getdealo/"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Dealo",
        "alternateName": "getdealo",
        "url": "https://getdealo.in/"
      }
    </script>

    <!--
      Legacy-host auto-redirect. Dealo moved off the geobuild.in subdomain to
      getdealo.in; anyone still landing on the old host is sent straight over.

      Inline and first in <head> on purpose: it runs before the ~280 kB (gzipped)
      module bundle is even requested, so the old domain never paints a frame of
      the app. Doing this from main.jsx instead would mean downloading and
      booting the whole SPA first, which shows a visible flash on mobile.

      Sends everyone to "/" rather than the equivalent path: verified 2026-07-30
      that deep links 404 on both hosts (getdealo.in/results → 301 → 404) because
      the S3/CloudFront distribution has no SPA fallback rewrite. Once that
      rewrite exists, append location.pathname + location.search + location.hash.

      location.replace, not assign: it leaves no history entry, so the back
      button returns the user to wherever they came from instead of bouncing them
      onto the old host and straight through this redirect again.
    -->
    <script>
      (function () {
        if (window.location.hostname === 'dealo.geobuild.in') {
          window.location.replace('https://getdealo.in/');
        }
      })();
    </script>

    <!--
      First-paint canvas colour. Chakra only applies the `bg` token once the JS
      bundle has loaded and React has rendered, so without this the browser
      paints its default colour first. Must stay in sync with the `bg` token in
      src/theme/foundations/colors.js — this used to be the old dark theme's
      #121311, which showed as a black strip down the right edge of the phone
      whenever anything on the page was wider than the screen.
    -->
    <style>
      html { background-color: #FAFAF7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
